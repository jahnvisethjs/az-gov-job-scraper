name: Refresh job catalog

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-job-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASU_AI_API_KEY: ${{ secrets.ASU_AI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh and pre-index jobs
        shell: bash
        run: |
          if [[ -z "$ASU_AI_API_KEY" || -z "$DATABASE_URL" ]]; then
            echo "::error::ASU_AI_API_KEY and DATABASE_URL repository secrets are required"
            exit 1
          fi
          python scripts/refresh_job_catalog.py
